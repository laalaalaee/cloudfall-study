name: Request notes
description: Ask for a subject, PYQ or study material that isn't on Cloudfall Study yet.
title: "[Request] "
labels: ["request"]
body:
  - type: input
    id: university
    attributes:
      label: University
      placeholder: Amity University Noida
    validations:
      required: true
  - type: input
    id: course
    attributes:
      label: Course and semester
      placeholder: B.Tech CSE, Semester 4
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: Subject name or course code
      placeholder: CSE202 Operating Systems
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What do you need?
      multiple: true
      options:
        - Notes
        - Previous year question papers (PYQs)
        - Syllabus
        - Lab files
        - Assignments
        - Other
